name: Release

# tag 触发发布：本地 `npm version <x.y.z>` 会 bump package.json + commit + 打 tag v<x.y.z>，
# 再 `git push --follow-tags` 把 tag 推上来即自动发布。本 workflow 不创建 tag、不写回 main，
# 只做：校验 tag 与 package.json 版本一致 → 测试/类型检查 → npm publish → 建 GitHub Release。
#
# 为什么 tag 触发：npm 账号开了 2FA，本地非交互 publish 会被 403 拦下。把 publish 放到 CI、
# 用 environment NPM_PUBLISH 下的 bypass-2FA token，即可一推 tag 全自动发布。
on:
  push:
    tags:
      - 'v*'

# 建 GitHub Release 需要写权限（不写回 main，故无需 commit 权限以外的东西）。
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # npm 发布 token 存在该 environment 的 secret（NPM_PUBLISH_TOKEN）里，需声明才能取到。
    environment: NPM_PUBLISH
    steps:
      - name: Checkout tag (full history — conventional-changelog 需要全部 tag)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          # 写入 .npmrc，让 `npm publish` 读 NODE_AUTH_TOKEN 认证。
          registry-url: 'https://registry.npmjs.org'

      - name: 校验 tag 与 package.json version 一致
        # npm publish 发布的版本取自 package.json，必须与 tag 名一致，否则会发错版本。
        # 本地用 `npm version` 打 tag 时两者天然一致；不一致说明流程被绕过，直接拒绝。
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag ($GITHUB_REF_NAME) 与 package.json version ($PKG) 不一致，拒绝发布。请用 npm version 打 tag。"
            exit 1
          fi

      - name: Install deps
        run: npm ci

      - name: Unit tests (server safety-net)
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: 生成本版 release notes（中文 conventional；无实质条目则回退 GitHub 自动生成）
        # 取 conventional-changelog 最新一段；仅当「首段标题确为当前版本」且「除标题外有实质条目」
        # 时才用它，否则置 USE_CONV=false（如本版只有 ci/chore 等不入 changelog 的 commit，
        # 避免拿到空 notes 或错位成上一版内容）。
        run: |
          VER="$(node -p "require('./package.json').version")"
          npx --yes conventional-changelog-cli -p conventionalcommits -r 2 \
            | awk 'BEGIN{n=0} /^## /{n++} n>=2{exit} {print}' > RELEASE_NOTES.md
          BODY="$(grep -v '^#' RELEASE_NOTES.md | grep -v '^[[:space:]]*$' || true)"
          if head -n 3 RELEASE_NOTES.md | grep -q "\[${VER}\]" && [ -n "$BODY" ]; then
            echo "USE_CONV=true" >> "$GITHUB_ENV"
          else
            echo "USE_CONV=false" >> "$GITHUB_ENV"
          fi
          echo "----- RELEASE_NOTES.md -----"
          cat RELEASE_NOTES.md

      - name: Publish to npm
        # prepublishOnly 会跑 `npm run build` 产出 dist/ 再发布。
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}

      - name: 建 GitHub Release
        run: |
          if [ "$USE_CONV" = "true" ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
